services:
  - type: web
    name: reach
    runtime: docker
    plan: free
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REACH_REPO_URL
        sync: false
